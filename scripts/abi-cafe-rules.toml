[target.'cfg(all(target_arch = "aarch64", target_os = "linux"))']
'F32Array::conv_c'.busted = "check"

# The C code that abi-cafe generates for f128 does not compile with the GCC of the aarch64 runner.
'Exhaust_F128x1::conv_c::repr_c::cgclif_calls_cc'.busted = "build"
'Exhaust_F128x1::conv_c::repr_c::cc_calls_cgclif'.busted = "build"
'Exhaust_f128::conv_c::repr_rust::cgclif_calls_cc'.busted = "build"
'Exhaust_f128::conv_c::repr_c::cgclif_calls_cc'.busted = "build"
'Exhaust_f128::conv_c::repr_rust::cc_calls_cgclif'.busted = "build"
'Exhaust_f128::conv_c::repr_c::cc_calls_cgclif'.busted = "build"
'F128x1::conv_c::repr_c::cgclif_calls_cc'.busted = "build"
'F128x1::conv_c::repr_c::cc_calls_cgclif'.busted = "build"
'F128x2::conv_c::repr_c::cgclif_calls_cc'.busted = "build"
'F128x2::conv_c::repr_c::cc_calls_cgclif'.busted = "build"
'f128::conv_c::repr_c::cgclif_calls_cc'.busted = "build"
'f128::conv_c::repr_c::cc_calls_cgclif'.busted = "build"

[target.'cfg(all(target_arch = "aarch64", target_os = "macos"))']
'OptionU128::conv_rust::repr_c::rustc_caller'.busted = "run"
'OptionU128::conv_rust::repr_c::cgclif_caller'.busted = "check"

[target.'cfg(all(target_arch = "x86_64", target_env = "msvc"))']
# ICE: https://github.com/rust-lang/rust/issues/164207
'EmptyStruct::conv_c::repr_c::rustc_calls_cgclif'.run = "skip"
'ZstFirst::conv_c::repr_c::rustc_calls_cgclif'.run = "skip"
'ZstLast::conv_c::repr_c::rustc_calls_cgclif'.run = "skip"
'ZstBetween::conv_c::repr_c::rustc_calls_cgclif'.run = "skip"
'Exhaust_ZstBetween::conv_c::repr_c::rustc_calls_cgclif'.run = "skip"
'ZstArray::conv_c::repr_c::rustc_calls_cgclif'.run = "skip"

# f128 does not work with the Rust ABI on this target.
'f128'.run = "skip"
'F128x1'.run = "skip"
'F128x2'.run = "skip"
'Exhaust_f128'.run = "skip"
'Exhaust_F128x1'.run = "skip"

# abi-cafe ignores the result of f16 with the C convention on x86_64 Linux, because the GCC of its CI
# is too old to support _Float16. Rust to Rust does not involve GCC, so check those.
[target.x86_64-unknown-linux-gnu.'f16::conv_c::rustc_calls_cgclif']
pass = "check"
[target.x86_64-unknown-linux-gnu.'f16::conv_c::cgclif_calls_rustc']
pass = "check"
